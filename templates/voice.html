<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Notes</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #f8f6fc;
            padding: 30px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #5e4caf;
        }
        button {
            padding: 12px 18px;
            margin: 10px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .start { background: linear-gradient(45deg, #8b67d3, #a98cf0); color: white; }
        .stop { background: linear-gradient(45deg, #e63946, #ff6b6b); color: white; }
        .download, .restart {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        }
        .download {
            background: linear-gradient(45deg, #ff9800, #ffb74d);
            color: white;
        }
        .restart {
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
        }
        .download:hover, .restart:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎤📝 Voice Notes</h2>
        <button class="start" onclick="startRecording()">🎤 Start Recording</button>
        <button class="stop" onclick="stopRecording()" disabled>⏹ Stop Recording</button>
        <button id="downloadButton" class="download" onclick="downloadAudio()">
            ⬇ Download Voice Note
        </button>
        <button id="restartButton" class="restart" onclick="restartPage()">🔄 Start Again</button>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                document.getElementById('downloadButton').style.display = 'flex';
                document.getElementById('restartButton').style.display = 'flex';
            };

            mediaRecorder.start();
            audioChunks = [];
            document.querySelector(".start").disabled = true;
            document.querySelector(".stop").disabled = false;
        }

        function stopRecording() {
            mediaRecorder.stop();
            document.querySelector(".start").disabled = false;
            document.querySelector(".stop").disabled = true;
        }

        function downloadAudio() {
            const audioUrl = URL.createObjectURL(audioBlob);
            const a = document.createElement("a");
            a.href = audioUrl;
            a.download = "voice-note.wav";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function restartPage() {
            location.reload();
        }
    </script>

</body>
</html>
